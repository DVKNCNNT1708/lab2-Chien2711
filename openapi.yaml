openapi: 3.1.0
info:
  title: Smart Campus — Lab 02 Contract
  version: 1.0.0
  description: Contract negotiation between IoT (Consumer) and Core (Provider).
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
              example:
                status: "ok"
  /alerts:
    post:
      summary: Create alert
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: "Alert created"
components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
      example:
        type: "/errors/type"
        title: "Bad Request"
        status: 400
        detail: "Invalid input"
        instance: "/errors/instance/1"
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'